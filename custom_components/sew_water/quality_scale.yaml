# Integration quality scale record: https://developers.home-assistant.io/docs/core/integration-quality-scale
rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: >
      Readings are published once a day; the default poll is pinned to 02:00 local time with up to 10 min
      of jitter and the interval is configurable in options.
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: done
    comment: The only dependency is aiohttp, shipped with Home Assistant; the portal client is bundled.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: exempt
    comment: Entities read coordinator data only and subscribe to nothing else.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: Provided by CoordinatorEntity; every entity goes unavailable when a poll fails.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: Provided by DataUpdateCoordinator, which logs once on failure and once on recovery.
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Cloud service; there is nothing on the network to discover.
  discovery-update-info:
    status: exempt
    comment: Cloud service; there is nothing on the network to discover.
  docs-data-update: done
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: done
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: One config entry is one account with one meter; devices are never added later.
  entity-category: todo
  entity-device-class: done
  entity-disabled-by-default: todo
  entity-translations: done
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices:
    status: exempt
    comment: One config entry is one account with one meter; removing the entry removes the device.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
